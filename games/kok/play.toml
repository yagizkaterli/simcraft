# ─────────────────────────────────────────────────────────────
#  PLAYER PANEL (kok) — what `simcraft-play` runs. Evals and tests keep engine.toml.
#  Side-view root organism: grow Kok downward through soil layers, branch Sivri, form Dugum.
# ─────────────────────────────────────────────────────────────

[run]
seed = 1
max_ticks = 5000

[params]
growth_cost = 10
sivri_cost = 5
nutrient_threshold = 20
branch_interval = 4
dugum_yield = 8
passive_absorb = 1
sivri_search_max = 6

[agent]
controllable = ["kok"]
